name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  nomo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Install pinned Go benchmark toolchain
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.12
          cache: false

      - name: Install pinned Benchmarks Game v2 schema validator
        run: python3 -m pip install -r scripts/requirements-benchmarksgame-v2.txt

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Release Build
        run: cargo build --workspace --release --locked

      - name: Test async benchmark harness
        run: python3 -m unittest discover -s scripts/tests

      - name: Run Benchmarks Game small-input correctness gate
        run: >-
          python3 scripts/benchmarksgame.py
          --mode correctness
          --nomo target/release/nomo
          --require-clean
          --output performance/results/benchmarksgame-ci.json

      - name: Upload Benchmarks Game correctness evidence
        uses: actions/upload-artifact@v7
        with:
          name: nomo-benchmarksgame-correctness
          path: performance/results/benchmarksgame-ci.json
          if-no-files-found: error

      - name: Run P0 async zero-cost and reference controls
        run: >-
          python3 scripts/async_benchmark.py
          --nomo target/release/nomo
          --require-clean
          --output performance/results/async-p0.json

      - name: Upload P0 async benchmark evidence
        uses: actions/upload-artifact@v7
        with:
          name: nomo-async-p0
          path: performance/results/async-p0.json
          if-no-files-found: error

      - name: Run P1 async counter and zero-cost gates
        run: >-
          python3 scripts/async_benchmark.py
          --nomo target/release/nomo
          --manifest performance/async/manifest-p1.json
          --require-clean
          --output performance/results/async-p1.json

      - name: Upload P1 async counter evidence
        uses: actions/upload-artifact@v7
        with:
          name: nomo-async-p1
          path: performance/results/async-p1.json
          if-no-files-found: error

      - name: Run P2 process-pipe comparison and resource gates
        run: >-
          python3 scripts/async_benchmark.py
          --nomo target/release/nomo
          --manifest performance/async/manifest-p2.json
          --require-clean
          --output performance/results/async-p2.json

      - name: Upload P2 process-pipe evidence
        uses: actions/upload-artifact@v7
        with:
          name: nomo-async-p2
          path: performance/results/async-p2.json
          if-no-files-found: error

      - name: Run P3 bounded-channel and no-cost gates
        run: >-
          python3 scripts/async_benchmark.py
          --nomo target/release/nomo
          --manifest performance/async/manifest-p3.json
          --require-clean
          --output performance/results/async-p3.json

      - name: Upload P3 bounded-channel evidence
        uses: actions/upload-artifact@v7
        with:
          name: nomo-async-p3
          path: performance/results/async-p3.json
          if-no-files-found: error

      - name: Build browser WebAssembly runtime
        run: >-
          cargo build --locked --release
          --target wasm32-unknown-unknown
          -p nomo-wasm

      - name: Verify browser WebAssembly sandbox
        run: >-
          node scripts/check_browser_wasm.mjs
          target/wasm32-unknown-unknown/release/nomo_wasm.wasm

      - name: Compiler clean-build and check latency gate
        run: >-
          python3 scripts/compiler_release_gate.py
          --nomo target/release/nomo
          --output performance/results/compiler-release-gate.json

      - name: Upload compiler release-gate evidence
        uses: actions/upload-artifact@v7
        with:
          name: nomo-compiler-release-gate
          path: performance/results/compiler-release-gate.json
          if-no-files-found: error

      - name: Check Example Formatting
        run: cargo run --bin nomo -- fmt --check examples

      - name: Check Standard Library Formatting
        run: cargo run --bin nomo -- fmt --check std

      - name: Check canonical syntax governance
        run: python3 scripts/check_syntax_governance.py --nomo target/release/nomo

      - name: Run durable SQLite Agent checkpoint across two processes
        shell: bash
        run: |
          database="$RUNNER_TEMP/nomo-agent-checkpoint.db"
          cargo run --locked --bin nomo -- \
            run examples/sqlite_agent_memory -- write "$database" \
            | grep 'checkpoint-written 1'
          cargo run --locked --bin nomo -- \
            run examples/sqlite_agent_memory -- read "$database" \
            | grep 'checkpoint {"next_tool":"search","attempt":2}'

      - name: Check Workspace Example
        run: cargo run --bin nomo -- check --workspace examples/workspace_basic

      - name: Test Workspace Example
        run: cargo run --bin nomo -- test --workspace examples/workspace_basic

      - name: Document Workspace Example
        run: cargo run --bin nomo -- doc --workspace examples/workspace_basic

  macos-cross-build:
    name: Cross build macOS arm64 to x86_64
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Nomo
        run: cargo build --locked --release --bin nomo

      - name: Link a real x86_64 Mach-O from the arm64 host
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          target/release/nomo build examples/result_helpers --target x86_64-apple-darwin
          artifact="examples/result_helpers/build/x86_64-apple-darwin-none/bin/result_helpers"
          test "$(lipo -archs "$artifact")" = "x86_64"
          file "$artifact" | grep "Mach-O 64-bit executable x86_64"
          grep 'nomo target: x86_64-apple-darwin-none' \
            examples/result_helpers/build/x86_64-apple-darwin-none/c/main.c
          target/release/nomo build examples/structured_json --target x86_64-apple-darwin
          json_artifact="examples/structured_json/build/x86_64-apple-darwin-none/bin/structured_json"
          test "$(lipo -archs "$json_artifact")" = "x86_64"
          grep 'nomo_json_from_object' \
            examples/structured_json/build/x86_64-apple-darwin-none/c/main.c
          target/release/nomo build examples/cron_schedule --target x86_64-apple-darwin
          cron_dir="examples/cron_schedule/build/x86_64-apple-darwin-none"
          cron_artifact="$cron_dir/bin/cron_schedule"
          test "$(lipo -archs "$cron_artifact")" = "x86_64"
          grep 'nomo_cron_next_after' "$cron_dir/c/main.c"
          target/release/nomo build examples/isolated_tasks --target x86_64-apple-darwin
          task_artifact="examples/isolated_tasks/build/x86_64-apple-darwin-none/bin/isolated_tasks"
          test "$(lipo -archs "$task_artifact")" = "x86_64"
          grep 'pthread_create' \
            examples/isolated_tasks/build/x86_64-apple-darwin-none/c/main.c
          target/release/nomo build examples/async_yield --target x86_64-apple-darwin
          async_dir="examples/async_yield/build/x86_64-apple-darwin-none"
          async_artifact="$async_dir/bin/async_yield"
          test "$(lipo -archs "$async_artifact")" = "x86_64"
          grep 'nomo_async_executor_run_root' "$async_dir/c/main.c"
          grep 'nomo_async_local_nomo_values' "$async_dir/c/main.c"
          grep 'frame->nomo_async_owned_nomo_values = 0u;' "$async_dir/c/main.c"
          ! grep -E 'pthread_create|__atomic_|Interlocked' "$async_dir/c/main.c"
          target/release/nomo build examples/async_structured_return --target x86_64-apple-darwin
          structured_dir="examples/async_structured_return/build/x86_64-apple-darwin-none"
          structured_artifact="$structured_dir/bin/async_structured_return"
          test "$(lipo -archs "$structured_artifact")" = "x86_64"
          grep 'NOMO_ASYNC_PENDING_JOIN' "$structured_dir/c/main.c"
          grep 'context->task_spawns += 1u;' "$structured_dir/c/main.c"
          grep 'nomo_payload_Ok = frame->nomo_async_child_' "$structured_dir/c/main.c"
          grep 'structured_waiter_frame = context->current_frame' "$structured_dir/c/main.c"
          ! grep -E 'pthread_create|__atomic_|Interlocked' "$structured_dir/c/main.c"
          target/release/nomo build examples/async_structured_cancel --target x86_64-apple-darwin
          cancel_dir="examples/async_structured_cancel/build/x86_64-apple-darwin-none"
          cancel_artifact="$cancel_dir/bin/async_structured_cancel"
          test "$(lipo -archs "$cancel_artifact")" = "x86_64"
          grep 'nomo_async_ready_cancel_frame' "$cancel_dir/c/main.c"
          grep 'nomo_async_cancel_slow_child' "$cancel_dir/c/main.c"
          grep 'nomo_async_timer_disarm' "$cancel_dir/c/main.c"
          ! grep -E 'pthread_create|__atomic_|Interlocked' "$cancel_dir/c/main.c"
          target/release/nomo build examples/async_structured_return_cancel --target x86_64-apple-darwin
          return_cancel_dir="examples/async_structured_return_cancel/build/x86_64-apple-darwin-none"
          return_cancel_artifact="$return_cancel_dir/bin/async_structured_return_cancel"
          test "$(lipo -archs "$return_cancel_artifact")" = "x86_64"
          grep 'nomo_async_cancel_slow_child' "$return_cancel_dir/c/main.c"
          grep 'frame->nomo_async_result = nomo___nomo_structured_return_value;' "$return_cancel_dir/c/main.c"
          grep 'structured_waiter_frame = context->current_frame' "$return_cancel_dir/c/main.c"
          ! grep -E 'pthread_create|__atomic_|Interlocked' "$return_cancel_dir/c/main.c"
          target/release/nomo build examples/async_structured_question_cancel --target x86_64-apple-darwin
          question_cancel_dir="examples/async_structured_question_cancel/build/x86_64-apple-darwin-none"
          question_cancel_artifact="$question_cancel_dir/bin/async_structured_question_cancel"
          test "$(lipo -archs "$question_cancel_artifact")" = "x86_64"
          grep 'nomo_async_question_result_3 = nomo_num_parse_i64' "$question_cancel_dir/c/main.c"
          grep 'nomo_async_cancel_slow_child' "$question_cancel_dir/c/main.c"
          grep 'frame->nomo_async_result_owned = 1u;' "$question_cancel_dir/c/main.c"
          ! grep -E 'pthread_create|__atomic_|Interlocked' "$question_cancel_dir/c/main.c"
          target/release/nomo build examples/async_structured_explicit_cancel --target x86_64-apple-darwin
          explicit_cancel_dir="examples/async_structured_explicit_cancel/build/x86_64-apple-darwin-none"
          explicit_cancel_artifact="$explicit_cancel_dir/bin/async_structured_explicit_cancel"
          test "$(lipo -archs "$explicit_cancel_artifact")" = "x86_64"
          grep 'NOMO_ASYNC_PENDING_CANCEL' "$explicit_cancel_dir/c/main.c"
          grep 'nomo_async_cancel_join_result_3' "$explicit_cancel_dir/c/main.c"
          grep 'nomo_async_cancel_slow_child' "$explicit_cancel_dir/c/main.c"
          grep 'nomo_async_timer_disarm' "$explicit_cancel_dir/c/main.c"
          ! grep -E 'pthread_create|__atomic_|Interlocked' "$explicit_cancel_dir/c/main.c"
          target/release/nomo build examples/async_structured_deadline --target x86_64-apple-darwin
          deadline_dir="examples/async_structured_deadline/build/x86_64-apple-darwin-none"
          deadline_artifact="$deadline_dir/bin/async_structured_deadline"
          test "$(lipo -archs "$deadline_artifact")" = "x86_64"
          grep 'nomo_async_deadline_arm' "$deadline_dir/c/main.c"
          grep 'NOMO_ASYNC_TASK_FAILURE_TIMEOUT' "$deadline_dir/c/main.c"
          grep 'deadline_expirations += 1u' "$deadline_dir/c/main.c"
          ! grep -E 'pthread_create|__atomic_|Interlocked' "$deadline_dir/c/main.c"
          target/release/nomo build examples/async_structured_panic_cleanup --target x86_64-apple-darwin
          panic_dir="examples/async_structured_panic_cleanup/build/x86_64-apple-darwin-none"
          panic_artifact="$panic_dir/bin/async_structured_panic_cleanup"
          test "$(lipo -archs "$panic_artifact")" = "x86_64"
          grep 'NOMO_ASYNC_PENDING_PANIC' "$panic_dir/c/main.c"
          grep 'nomo_async_cancel_main' "$panic_dir/c/main.c"
          grep 'nomo_panic_string' "$panic_dir/c/main.c"
          ! grep -E 'pthread_create|__atomic_|Interlocked' "$panic_dir/c/main.c"
          target/release/nomo build examples/sqlite_agent_memory --target x86_64-apple-darwin
          sqlite_dir="examples/sqlite_agent_memory/build/x86_64-apple-darwin-none"
          sqlite_artifact="$sqlite_dir/bin/sqlite_agent_memory"
          test "$(lipo -archs "$sqlite_artifact")" = "x86_64"
          file "$sqlite_artifact" | grep "Mach-O 64-bit executable x86_64"
          nm "$sqlite_artifact" | grep '_sqlite3_open_v2'
          grep 'nomo_sqlite_open_internal' "$sqlite_dir/c/main.c"
          shasum -a 256 "$sqlite_dir/c/sqlite3.c" \
            | grep '87497ab605bedd0dbee27a209c1eeff8c89b229b13f921a7efdbb81a13f779fd'

      - name: Upload cross-build evidence
        uses: actions/upload-artifact@v7
        with:
          name: nomo-macos-arm64-to-x86_64
          path: |
            examples/result_helpers/build/x86_64-apple-darwin-none
            examples/structured_json/build/x86_64-apple-darwin-none
            examples/cron_schedule/build/x86_64-apple-darwin-none
            examples/isolated_tasks/build/x86_64-apple-darwin-none
            examples/async_yield/build/x86_64-apple-darwin-none
            examples/async_structured_return/build/x86_64-apple-darwin-none
            examples/async_structured_cancel/build/x86_64-apple-darwin-none
            examples/async_structured_return_cancel/build/x86_64-apple-darwin-none
            examples/async_structured_question_cancel/build/x86_64-apple-darwin-none
            examples/async_structured_explicit_cancel/build/x86_64-apple-darwin-none
            examples/async_structured_deadline/build/x86_64-apple-darwin-none
            examples/async_structured_panic_cleanup/build/x86_64-apple-darwin-none
            examples/sqlite_agent_memory/build/x86_64-apple-darwin-none
          if-no-files-found: error

  benchmark-v2-portability:
    name: Benchmark v2 correctness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.12
          cache: false
      - name: Resolve the pinned Go driver
        id: benchmark-go
        shell: pwsh
        run: |
          $go = Get-Command go -CommandType Application -ErrorAction Stop |
            Select-Object -First 1 -ExpandProperty Source
          if (-not [System.IO.Path]::IsPathRooted($go)) {
            throw "setup-go did not expose an absolute Go invocation path: $go"
          }
          "path=$go" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Verify frozen benchmark checkout uses LF bytes
        shell: pwsh
        run: |
          $paths = @(
            "performance/benchmarksgame/manifest-v2.json",
            "performance/benchmarksgame/reference/c/spectral-norm.c",
            "performance/benchmarksgame/reference/cpp/spectral-norm.cpp",
            "performance/benchmarksgame/reference/go/spectral-norm.go",
            "performance/benchmarksgame/reference/nomo/spectral-norm/src/main.nomo",
            "performance/benchmarksgame/reference/nomo/spectral-norm/nomo.toml",
            "performance/benchmarksgame/fixtures/spectral-norm-100.txt",
            "performance/benchmarksgame/README-v2.md",
            "scripts/benchmarksgame_v2.py"
          )
          foreach ($path in $paths) {
            $attribute = git check-attr eol -- $path
            if ($attribute -notmatch "eol: lf$") {
              throw "frozen benchmark path is not eol=lf: $attribute"
            }
          }
      - name: Install pinned Draft 2020-12 validator
        run: python -m pip install -r scripts/requirements-benchmarksgame-v2.txt
      - name: Verify Clang C and C++ drivers
        run: |
          clang --version
          clang++ --version
      - name: Build correctness driver
        run: cargo build --locked --release --bin nomo
      - name: Run v2 schema, statistics, provenance, and collector tests
        run: python -m unittest scripts.tests.test_benchmarksgame_v2 -v
      - name: Run v2 small-input correctness gate
        run: >-
          python scripts/benchmarksgame_v2.py
          --mode correctness
          --nomo target/release/nomo
          --go "${{ steps.benchmark-go.outputs.path }}"
          --require-clean
          --output performance/results/benchmarksgame-v2/ci-${{ runner.os }}.json
      - name: Upload v2 correctness evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: nomo-benchmarksgame-v2-${{ runner.os }}
          path: |
            performance/results/benchmarksgame-v2/ci-${{ runner.os }}.json
            performance/results/benchmarksgame-v2/ci-${{ runner.os }}.log
          if-no-files-found: error

  linux-cross-build:
    name: Cross build Linux x86_64 to arm64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install arm64 GNU toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu qemu-user

      - name: Build Nomo
        run: cargo build --locked --release --bin nomo

      - name: Link and execute a real arm64 ELF from the x86_64 host
        shell: bash
        run: |
          test "$(uname -m)" = "x86_64"
          target/release/nomo build examples/result_helpers --target aarch64-unknown-linux-gnu
          artifact="examples/result_helpers/build/aarch64-unknown-linux-gnu/bin/result_helpers"
          readelf -h "$artifact" | grep 'Machine:.*AArch64'
          file "$artifact" | grep 'ELF 64-bit.*ARM aarch64'
          qemu-aarch64 -L /usr/aarch64-linux-gnu "$artifact"
          grep 'nomo target: aarch64-unknown-linux-gnu' \
            examples/result_helpers/build/aarch64-unknown-linux-gnu/c/main.c
          target/release/nomo build examples/structured_json --target aarch64-unknown-linux-gnu
          json_artifact="examples/structured_json/build/aarch64-unknown-linux-gnu/bin/structured_json"
          readelf -h "$json_artifact" | grep 'Machine:.*AArch64'
          qemu-aarch64 -L /usr/aarch64-linux-gnu "$json_artifact" \
            | grep 'Hello from structured JSON'
          target/release/nomo build examples/cron_schedule --target aarch64-unknown-linux-gnu
          cron_dir="examples/cron_schedule/build/aarch64-unknown-linux-gnu"
          cron_artifact="$cron_dir/bin/cron_schedule"
          readelf -h "$cron_artifact" | grep 'Machine:.*AArch64'
          grep 'nomo_cron_next_after' "$cron_dir/c/main.c"
          qemu-aarch64 -L /usr/aarch64-linux-gnu "$cron_artifact" \
            | grep 'next=900000'
          target/release/nomo build examples/isolated_tasks --target aarch64-unknown-linux-gnu
          task_artifact="examples/isolated_tasks/build/aarch64-unknown-linux-gnu/bin/isolated_tasks"
          readelf -h "$task_artifact" | grep 'Machine:.*AArch64'
          qemu-aarch64 -L /usr/aarch64-linux-gnu "$task_artifact" \
            | grep 'cancelled:cooperative'
          target/release/nomo build examples/async_yield --target aarch64-unknown-linux-gnu
          async_dir="examples/async_yield/build/aarch64-unknown-linux-gnu"
          async_artifact="$async_dir/bin/async_yield"
          readelf -h "$async_artifact" | grep 'Machine:.*AArch64'
          grep 'nomo_async_executor_run_root' "$async_dir/c/main.c"
          grep 'nomo_async_local_nomo_values' "$async_dir/c/main.c"
          grep 'frame->nomo_async_owned_nomo_values = 0u;' "$async_dir/c/main.c"
          ! grep -E 'pthread_create|__atomic_|Interlocked' "$async_dir/c/main.c"
          qemu-aarch64 -L /usr/aarch64-linux-gnu "$async_artifact" \
            | grep '^frame-owned message$'
          target/release/nomo build examples/async_structured_return --target aarch64-unknown-linux-gnu
          structured_dir="examples/async_structured_return/build/aarch64-unknown-linux-gnu"
          structured_artifact="$structured_dir/bin/async_structured_return"
          readelf -h "$structured_artifact" | grep 'Machine:.*AArch64'
          grep 'NOMO_ASYNC_PENDING_JOIN' "$structured_dir/c/main.c"
          grep 'context->task_spawns += 1u;' "$structured_dir/c/main.c"
          grep 'nomo_payload_Ok = frame->nomo_async_child_' "$structured_dir/c/main.c"
          grep 'structured_waiter_frame = context->current_frame' "$structured_dir/c/main.c"
          ! grep -E 'pthread_create|__atomic_|Interlocked' "$structured_dir/c/main.c"
          qemu-aarch64 -L /usr/aarch64-linux-gnu "$structured_artifact" \
            | grep '^gathered$'
          target/release/nomo build examples/async_structured_cancel --target aarch64-unknown-linux-gnu
          cancel_dir="examples/async_structured_cancel/build/aarch64-unknown-linux-gnu"
          cancel_artifact="$cancel_dir/bin/async_structured_cancel"
          readelf -h "$cancel_artifact" | grep 'Machine:.*AArch64'
          grep 'nomo_async_ready_cancel_frame' "$cancel_dir/c/main.c"
          grep 'nomo_async_cancel_slow_child' "$cancel_dir/c/main.c"
          grep 'nomo_async_timer_disarm' "$cancel_dir/c/main.c"
          ! grep -E 'pthread_create|__atomic_|Interlocked' "$cancel_dir/c/main.c"
          qemu-aarch64 -L /usr/aarch64-linux-gnu "$cancel_artifact" \
            | grep '^scope closed$'
          target/release/nomo build examples/async_structured_return_cancel --target aarch64-unknown-linux-gnu
          return_cancel_dir="examples/async_structured_return_cancel/build/aarch64-unknown-linux-gnu"
          return_cancel_artifact="$return_cancel_dir/bin/async_structured_return_cancel"
          readelf -h "$return_cancel_artifact" | grep 'Machine:.*AArch64'
          grep 'nomo_async_cancel_slow_child' "$return_cancel_dir/c/main.c"
          grep 'frame->nomo_async_result = nomo___nomo_structured_return_value;' "$return_cancel_dir/c/main.c"
          grep 'structured_waiter_frame = context->current_frame' "$return_cancel_dir/c/main.c"
          ! grep -E 'pthread_create|__atomic_|Interlocked' "$return_cancel_dir/c/main.c"
          qemu-aarch64 -L /usr/aarch64-linux-gnu "$return_cancel_artifact" \
            | grep '^managed$'
          target/release/nomo build examples/async_structured_question_cancel --target aarch64-unknown-linux-gnu
          question_cancel_dir="examples/async_structured_question_cancel/build/aarch64-unknown-linux-gnu"
          question_cancel_artifact="$question_cancel_dir/bin/async_structured_question_cancel"
          readelf -h "$question_cancel_artifact" | grep 'Machine:.*AArch64'
          grep 'nomo_async_question_result_3 = nomo_num_parse_i64' "$question_cancel_dir/c/main.c"
          grep 'nomo_async_cancel_slow_child' "$question_cancel_dir/c/main.c"
          grep 'frame->nomo_async_result_owned = 1u;' "$question_cancel_dir/c/main.c"
          ! grep -E 'pthread_create|__atomic_|Interlocked' "$question_cancel_dir/c/main.c"
          qemu-aarch64 -L /usr/aarch64-linux-gnu "$question_cancel_artifact" \
            | grep '^true$'
          target/release/nomo build examples/async_structured_explicit_cancel --target aarch64-unknown-linux-gnu
          explicit_cancel_dir="examples/async_structured_explicit_cancel/build/aarch64-unknown-linux-gnu"
          explicit_cancel_artifact="$explicit_cancel_dir/bin/async_structured_explicit_cancel"
          readelf -h "$explicit_cancel_artifact" | grep 'Machine:.*AArch64'
          grep 'NOMO_ASYNC_PENDING_CANCEL' "$explicit_cancel_dir/c/main.c"
          grep 'nomo_async_cancel_join_result_3' "$explicit_cancel_dir/c/main.c"
          grep 'nomo_async_cancel_slow_child' "$explicit_cancel_dir/c/main.c"
          grep 'nomo_async_timer_disarm' "$explicit_cancel_dir/c/main.c"
          ! grep -E 'pthread_create|__atomic_|Interlocked' "$explicit_cancel_dir/c/main.c"
          explicit_cancel_output=$(qemu-aarch64 -L /usr/aarch64-linux-gnu "$explicit_cancel_artifact")
          test "$explicit_cancel_output" = "$(printf 'managed before\ncancelled true')"
          target/release/nomo build examples/async_structured_deadline --target aarch64-unknown-linux-gnu
          deadline_dir="examples/async_structured_deadline/build/aarch64-unknown-linux-gnu"
          deadline_artifact="$deadline_dir/bin/async_structured_deadline"
          readelf -h "$deadline_artifact" | grep 'Machine:.*AArch64'
          grep 'nomo_async_deadline_arm' "$deadline_dir/c/main.c"
          grep 'NOMO_ASYNC_TASK_FAILURE_TIMEOUT' "$deadline_dir/c/main.c"
          grep 'deadline_expirations += 1u' "$deadline_dir/c/main.c"
          ! grep -E 'pthread_create|__atomic_|Interlocked' "$deadline_dir/c/main.c"
          qemu-aarch64 -L /usr/aarch64-linux-gnu "$deadline_artifact" \
            | grep '^deadline elapsed true$'
          target/release/nomo build examples/async_structured_panic_cleanup --target aarch64-unknown-linux-gnu
          panic_dir="examples/async_structured_panic_cleanup/build/aarch64-unknown-linux-gnu"
          panic_artifact="$panic_dir/bin/async_structured_panic_cleanup"
          readelf -h "$panic_artifact" | grep 'Machine:.*AArch64'
          grep 'NOMO_ASYNC_PENDING_PANIC' "$panic_dir/c/main.c"
          grep 'nomo_async_cancel_main' "$panic_dir/c/main.c"
          grep 'nomo_panic_string' "$panic_dir/c/main.c"
          ! grep -E 'pthread_create|__atomic_|Interlocked' "$panic_dir/c/main.c"
          set +e
          panic_output=$(qemu-aarch64 -L /usr/aarch64-linux-gnu "$panic_artifact" 2>&1)
          panic_status=$?
          set -e
          test "$panic_status" -eq 1
          printf '%s\n' "$panic_output" | grep '^managed slow before$'
          printf '%s\n' "$panic_output" | grep '^panic: panic from child$'
          target/release/nomo build examples/sqlite_agent_memory --target aarch64-unknown-linux-gnu
          sqlite_dir="examples/sqlite_agent_memory/build/aarch64-unknown-linux-gnu"
          sqlite_artifact="$sqlite_dir/bin/sqlite_agent_memory"
          readelf -h "$sqlite_artifact" | grep 'Machine:.*AArch64'
          readelf --wide -s "$sqlite_artifact" | grep 'sqlite3_open_v2'
          grep 'nomo_sqlite_open_internal' "$sqlite_dir/c/main.c"
          sha256sum "$sqlite_dir/c/sqlite3.c" \
            | grep '87497ab605bedd0dbee27a209c1eeff8c89b229b13f921a7efdbb81a13f779fd'
          sqlite_database="$RUNNER_TEMP/nomo-agent-checkpoint-arm64.db"
          qemu-aarch64 -L /usr/aarch64-linux-gnu "$sqlite_artifact" \
            write "$sqlite_database" | grep 'checkpoint-written 1'
          qemu-aarch64 -L /usr/aarch64-linux-gnu "$sqlite_artifact" \
            read "$sqlite_database" \
            | grep 'checkpoint {"next_tool":"search","attempt":2}'

      - name: Upload cross-build evidence
        uses: actions/upload-artifact@v7
        with:
          name: nomo-linux-x86_64-to-arm64
          path: |
            examples/result_helpers/build/aarch64-unknown-linux-gnu
            examples/structured_json/build/aarch64-unknown-linux-gnu
            examples/cron_schedule/build/aarch64-unknown-linux-gnu
            examples/isolated_tasks/build/aarch64-unknown-linux-gnu
            examples/async_yield/build/aarch64-unknown-linux-gnu
            examples/async_structured_return/build/aarch64-unknown-linux-gnu
            examples/async_structured_cancel/build/aarch64-unknown-linux-gnu
            examples/async_structured_return_cancel/build/aarch64-unknown-linux-gnu
            examples/async_structured_question_cancel/build/aarch64-unknown-linux-gnu
            examples/async_structured_explicit_cancel/build/aarch64-unknown-linux-gnu
            examples/async_structured_deadline/build/aarch64-unknown-linux-gnu
            examples/async_structured_panic_cleanup/build/aarch64-unknown-linux-gnu
            examples/sqlite_agent_memory/build/aarch64-unknown-linux-gnu
          if-no-files-found: error

name: Pull Request Smoke

on:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.12
          cache: false
      - name: Format
        run: cargo fmt --check
      - name: Lint affected compiler and runtime crates
        run: >-
          cargo clippy
          -p nomo
          -p nomo-compiler
          -p nomo-codegen-c
          -p nomo-std
          -p nomo-wasm
          -p nomo-manifest
          --locked -- -D warnings
      - name: Test affected compiler and runtime crates
        run: >-
          cargo test
          -p nomo
          -p nomo-compiler
          -p nomo-codegen-c
          -p nomo-std
          -p nomo-wasm
          -p nomo-manifest
          --locked
      - name: Run owner-affine async TCP lifecycle through epoll
        run: >-
          cargo test -p nomo --test cli_project
          async_tcp
          --locked
      - name: Build and verify browser WebAssembly runtime
        shell: bash
        run: |
          cargo build --locked --release \
            --target wasm32-unknown-unknown \
            -p nomo-wasm
          node scripts/check_browser_wasm.mjs \
            target/wasm32-unknown-unknown/release/nomo_wasm.wasm
      - name: Check project fixture
        run: cargo run --locked --bin nomo -- check --workspace examples/workspace_basic
      - name: Build release benchmark driver
        run: cargo build --locked --release --bin nomo
      - name: Test async benchmark harness
        run: python3 -m unittest discover -s scripts/tests
      - name: Run P0 async zero-cost and reference controls
        run: >-
          python3 scripts/async_benchmark.py
          --nomo target/release/nomo
          --require-clean
          --output performance/results/async-p0.json
      - name: Upload P0 async benchmark evidence
        uses: actions/upload-artifact@v7
        with:
          name: nomo-async-p0
          path: performance/results/async-p0.json
          if-no-files-found: error
      - name: Run P1 async counter and zero-cost gates
        run: >-
          python3 scripts/async_benchmark.py
          --nomo target/release/nomo
          --manifest performance/async/manifest-p1.json
          --require-clean
          --output performance/results/async-p1.json
      - name: Upload P1 async counter evidence
        uses: actions/upload-artifact@v7
        with:
          name: nomo-async-p1
          path: performance/results/async-p1.json
          if-no-files-found: error

      - name: Run P3 bounded-channel and no-cost gates
        run: >-
          python3 scripts/async_benchmark.py
          --nomo target/release/nomo
          --manifest performance/async/manifest-p3.json
          --require-clean
          --output performance/results/async-p3.json

      - name: Upload P3 bounded-channel evidence
        uses: actions/upload-artifact@v7
        with:
          name: nomo-async-p3
          path: performance/results/async-p3.json
          if-no-files-found: error

  windows-host-runtime:
    name: Run native host runtimes on Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Verify the native C driver
        run: clang --version
      - name: Run current-thread async call ABI and timer counter probes
        shell: pwsh
        run: |
          $metrics = Join-Path $env:RUNNER_TEMP "nomo-async-metrics.json"
          $env:NOMO_ASYNC_METRICS_PATH = $metrics
          cargo run --locked --bin nomo -- run examples/async_call_abi
          $payload = Get-Content -Raw $metrics | ConvertFrom-Json
          if ($payload.schema -ne 1 -or $payload.runtime -ne "nomo-c99-current-thread") {
            throw "unexpected async metrics identity"
          }
          if ($payload.counters.poll_calls -ne 5 `
              -or $payload.counters.cooperative_yields -ne 2 `
              -or $payload.counters.frame_allocations -ne 0 `
              -or $payload.counters.frame_drops -ne 2) {
            throw "unexpected async frame counters"
          }
          if ($payload.counters.timer_registrations -ne 0 -or $payload.counters.live_timers -ne 0) {
            throw "unexpected yield-only timer counters"
          }
          if ($payload.counters.reactor_initializations -ne 0 `
              -or $payload.counters.reactor_waits -ne 0 `
              -or $payload.counters.reactor_timeouts -ne 0 `
              -or $payload.counters.reactor_completions -ne 0 `
              -or $payload.counters.reactor_errors -ne 0 `
              -or $payload.counters.reactor_shutdowns -ne 0 `
              -or $payload.counters.live_reactors -ne 0 `
              -or $payload.counters.peak_live_reactors -ne 0) {
            throw "unexpected yield-only reactor counters"
          }
          $timerMetrics = Join-Path $env:RUNNER_TEMP "nomo-async-timer-metrics.json"
          $env:NOMO_ASYNC_METRICS_PATH = $timerMetrics
          cargo run --locked --bin nomo -- run examples/async_timer
          $timerPayload = Get-Content -Raw $timerMetrics | ConvertFrom-Json
          if ($timerPayload.counters.poll_calls -ne 2 `
              -or $timerPayload.counters.timer_registrations -ne 1 `
              -or $timerPayload.counters.timer_expirations -ne 1 `
              -or $timerPayload.counters.timer_cancellations -ne 0 `
              -or $timerPayload.counters.live_timers -ne 0 `
              -or $timerPayload.counters.peak_live_timers -ne 1 `
              -or $timerPayload.counters.reactor_initializations -ne 1 `
              -or $timerPayload.counters.reactor_waits -ne 1 `
              -or $timerPayload.counters.reactor_timeouts -ne 1 `
              -or $timerPayload.counters.reactor_completions -ne 0 `
              -or $timerPayload.counters.reactor_errors -ne 0 `
              -or $timerPayload.counters.reactor_shutdowns -ne 1 `
              -or $timerPayload.counters.live_reactors -ne 0 `
              -or $timerPayload.counters.peak_live_reactors -ne 1) {
            throw "unexpected async timer counters"
          }
          $tcpMetrics = Join-Path $env:RUNNER_TEMP "nomo-async-tcp-metrics.json"
          $env:NOMO_ASYNC_METRICS_PATH = $tcpMetrics
          $tcpOutput = cargo run --locked --bin nomo -- run examples/async_tcp_connect
          if (($tcpOutput -join "`n") -notmatch "Windows hostname resolution remains a later P2-TCP-D slice") {
            throw "unexpected Windows async TCP result"
          }
          $tcpPayload = Get-Content -Raw $tcpMetrics | ConvertFrom-Json
          if ($tcpPayload.counters.io_connect_starts -ne 1 `
              -or $tcpPayload.counters.io_ready_completions -ne 0 `
              -or $tcpPayload.counters.reactor_registrations -ne 0 `
              -or $tcpPayload.counters.reactor_deregistrations -ne 0 `
              -or $tcpPayload.counters.live_reactor_registrations -ne 0 `
              -or $tcpPayload.counters.live_io_handles -ne 0 `
              -or $tcpPayload.counters.live_io_operations -ne 0 `
              -or $tcpPayload.counters.blocking_pool_initializations -ne 0 `
              -or $tcpPayload.counters.blocking_threads_started -ne 0 `
              -or $tcpPayload.counters.blocking_jobs_queued -ne 0 `
              -or $tcpPayload.counters.live_blocking_threads -ne 0 `
              -or $tcpPayload.counters.live_blocking_jobs -ne 0) {
            throw "unexpected Windows async TCP counters"
          }
          $structuredMetrics = Join-Path $env:RUNNER_TEMP "nomo-async-structured-metrics.json"
          $env:NOMO_ASYNC_METRICS_PATH = $structuredMetrics
          cargo run --locked --bin nomo -- run examples/async_structured_void
          $structuredPayload = Get-Content -Raw $structuredMetrics | ConvertFrom-Json
          if ($structuredPayload.counters.poll_calls -ne 6 `
              -or $structuredPayload.counters.frame_drops -ne 3 `
              -or $structuredPayload.counters.ready_queue_enqueues -ne 5 `
              -or $structuredPayload.counters.ready_queue_dequeues -ne 5 `
              -or $structuredPayload.counters.ready_queue_saturations -ne 0 `
              -or $structuredPayload.counters.task_spawns -ne 2 `
              -or $structuredPayload.counters.task_joins -ne 2 `
              -or $structuredPayload.counters.join_suspensions -ne 1) {
            throw "unexpected structured task counters"
          }
          $structuredResultMetrics = Join-Path $env:RUNNER_TEMP "nomo-async-structured-result-metrics.json"
          $env:NOMO_ASYNC_METRICS_PATH = $structuredResultMetrics
          cargo run --locked --bin nomo -- run examples/async_structured_results
          $structuredResultPayload = Get-Content -Raw $structuredResultMetrics | ConvertFrom-Json
          if ($structuredResultPayload.counters.poll_calls -ne 6 `
              -or $structuredResultPayload.counters.frame_drops -ne 3 `
              -or $structuredResultPayload.counters.ready_queue_enqueues -ne 5 `
              -or $structuredResultPayload.counters.ready_queue_dequeues -ne 5 `
              -or $structuredResultPayload.counters.ready_queue_saturations -ne 0 `
              -or $structuredResultPayload.counters.task_spawns -ne 2 `
              -or $structuredResultPayload.counters.task_joins -ne 2 `
              -or $structuredResultPayload.counters.join_suspensions -ne 1) {
            throw "unexpected structured typed-result counters"
          }
          $structuredReturnMetrics = Join-Path $env:RUNNER_TEMP "nomo-async-structured-return-metrics.json"
          $env:NOMO_ASYNC_METRICS_PATH = $structuredReturnMetrics
          cargo run --locked --bin nomo -- run examples/async_structured_return
          $structuredReturnPayload = Get-Content -Raw $structuredReturnMetrics | ConvertFrom-Json
          if ($structuredReturnPayload.counters.poll_calls -ne 6 `
              -or $structuredReturnPayload.counters.cooperative_yields -ne 1 `
              -or $structuredReturnPayload.counters.frame_drops -ne 3 `
              -or $structuredReturnPayload.counters.ready_queue_enqueues -ne 3 `
              -or $structuredReturnPayload.counters.ready_queue_dequeues -ne 3 `
              -or $structuredReturnPayload.counters.task_spawns -ne 1 `
              -or $structuredReturnPayload.counters.task_joins -ne 1 `
              -or $structuredReturnPayload.counters.join_suspensions -ne 1) {
            throw "unexpected structured scope-return counters"
          }
          $structuredCancelMetrics = Join-Path $env:RUNNER_TEMP "nomo-async-structured-cancel-metrics.json"
          $env:NOMO_ASYNC_METRICS_PATH = $structuredCancelMetrics
          cargo run --locked --bin nomo -- run examples/async_structured_cancel
          $structuredCancelPayload = Get-Content -Raw $structuredCancelMetrics | ConvertFrom-Json
          if ($structuredCancelPayload.counters.poll_calls -ne 4 `
              -or $structuredCancelPayload.counters.frame_drops -ne 3 `
              -or $structuredCancelPayload.counters.ready_queue_enqueues -ne 5 `
              -or $structuredCancelPayload.counters.ready_queue_dequeues -ne 3 `
              -or $structuredCancelPayload.counters.ready_queue_cancellations -ne 2 `
              -or $structuredCancelPayload.counters.task_spawns -ne 4 `
              -or $structuredCancelPayload.counters.task_joins -ne 1 `
              -or $structuredCancelPayload.counters.join_suspensions -ne 1 `
              -or $structuredCancelPayload.counters.task_cancellations -ne 3 `
              -or $structuredCancelPayload.counters.timer_registrations -ne 1 `
              -or $structuredCancelPayload.counters.timer_expirations -ne 0 `
              -or $structuredCancelPayload.counters.timer_cancellations -ne 1 `
              -or $structuredCancelPayload.counters.live_timers -ne 0 `
              -or $structuredCancelPayload.counters.peak_live_timers -ne 1) {
            throw "unexpected structured scope-cancel counters"
          }
          $structuredReturnCancelMetrics = Join-Path $env:RUNNER_TEMP "nomo-async-structured-return-cancel-metrics.json"
          $env:NOMO_ASYNC_METRICS_PATH = $structuredReturnCancelMetrics
          cargo run --locked --bin nomo -- run examples/async_structured_return_cancel
          $structuredReturnCancelPayload = Get-Content -Raw $structuredReturnCancelMetrics | ConvertFrom-Json
          if ($structuredReturnCancelPayload.counters.poll_calls -ne 6 `
              -or $structuredReturnCancelPayload.counters.frame_drops -ne 4 `
              -or $structuredReturnCancelPayload.counters.peak_live_frames -ne 4 `
              -or $structuredReturnCancelPayload.counters.ready_queue_enqueues -ne 3 `
              -or $structuredReturnCancelPayload.counters.ready_queue_dequeues -ne 3 `
              -or $structuredReturnCancelPayload.counters.task_spawns -ne 2 `
              -or $structuredReturnCancelPayload.counters.task_joins -ne 1 `
              -or $structuredReturnCancelPayload.counters.join_suspensions -ne 1 `
              -or $structuredReturnCancelPayload.counters.task_cancellations -ne 1 `
              -or $structuredReturnCancelPayload.counters.timer_registrations -ne 1 `
              -or $structuredReturnCancelPayload.counters.timer_expirations -ne 0 `
              -or $structuredReturnCancelPayload.counters.timer_cancellations -ne 1 `
              -or $structuredReturnCancelPayload.counters.live_timers -ne 0 `
              -or $structuredReturnCancelPayload.counters.peak_live_timers -ne 1) {
            throw "unexpected structured scope-return-cancel counters"
          }
          $structuredQuestionCancelMetrics = Join-Path $env:RUNNER_TEMP "nomo-async-structured-question-cancel-metrics.json"
          $env:NOMO_ASYNC_METRICS_PATH = $structuredQuestionCancelMetrics
          cargo run --locked --bin nomo -- run examples/async_structured_question_cancel
          $structuredQuestionCancelPayload = Get-Content -Raw $structuredQuestionCancelMetrics | ConvertFrom-Json
          if ($structuredQuestionCancelPayload.counters.poll_calls -ne 6 `
              -or $structuredQuestionCancelPayload.counters.frame_drops -ne 4 `
              -or $structuredQuestionCancelPayload.counters.peak_live_frames -ne 4 `
              -or $structuredQuestionCancelPayload.counters.ready_queue_enqueues -ne 3 `
              -or $structuredQuestionCancelPayload.counters.ready_queue_dequeues -ne 3 `
              -or $structuredQuestionCancelPayload.counters.task_spawns -ne 2 `
              -or $structuredQuestionCancelPayload.counters.task_joins -ne 1 `
              -or $structuredQuestionCancelPayload.counters.join_suspensions -ne 1 `
              -or $structuredQuestionCancelPayload.counters.task_cancellations -ne 1 `
              -or $structuredQuestionCancelPayload.counters.timer_registrations -ne 1 `
              -or $structuredQuestionCancelPayload.counters.timer_expirations -ne 0 `
              -or $structuredQuestionCancelPayload.counters.timer_cancellations -ne 1 `
              -or $structuredQuestionCancelPayload.counters.live_timers -ne 0 `
              -or $structuredQuestionCancelPayload.counters.peak_live_timers -ne 1) {
            throw "unexpected structured scope-question-cancel counters"
          }
          $structuredExplicitCancelMetrics = Join-Path $env:RUNNER_TEMP "nomo-async-structured-explicit-cancel-metrics.json"
          $env:NOMO_ASYNC_METRICS_PATH = $structuredExplicitCancelMetrics
          $structuredExplicitCancelOutput = cargo run --locked --bin nomo -- run examples/async_structured_explicit_cancel
          if (($structuredExplicitCancelOutput -join "`n") -notmatch "managed before`ncancelled true") {
            throw "unexpected structured explicit-cancel output"
          }
          $structuredExplicitCancelPayload = Get-Content -Raw $structuredExplicitCancelMetrics | ConvertFrom-Json
          if ($structuredExplicitCancelPayload.counters.poll_calls -ne 5 `
              -or $structuredExplicitCancelPayload.counters.cooperative_yields -ne 1 `
              -or $structuredExplicitCancelPayload.counters.frame_allocations -ne 0 `
              -or $structuredExplicitCancelPayload.counters.frame_drops -ne 3 `
              -or $structuredExplicitCancelPayload.counters.peak_live_frames -ne 3 `
              -or $structuredExplicitCancelPayload.counters.ready_queue_enqueues -ne 4 `
              -or $structuredExplicitCancelPayload.counters.ready_queue_dequeues -ne 4 `
              -or $structuredExplicitCancelPayload.counters.ready_queue_cancellations -ne 0 `
              -or $structuredExplicitCancelPayload.counters.task_spawns -ne 2 `
              -or $structuredExplicitCancelPayload.counters.task_joins -ne 1 `
              -or $structuredExplicitCancelPayload.counters.join_suspensions -ne 1 `
              -or $structuredExplicitCancelPayload.counters.task_cancellations -ne 1 `
              -or $structuredExplicitCancelPayload.counters.timer_registrations -ne 1 `
              -or $structuredExplicitCancelPayload.counters.timer_expirations -ne 0 `
              -or $structuredExplicitCancelPayload.counters.timer_cancellations -ne 1 `
              -or $structuredExplicitCancelPayload.counters.live_timers -ne 0 `
              -or $structuredExplicitCancelPayload.counters.peak_live_timers -ne 1) {
            throw "unexpected structured explicit-cancel counters"
          }
          $structuredDeadlineMetrics = Join-Path $env:RUNNER_TEMP "nomo-async-structured-deadline-metrics.json"
          $env:NOMO_ASYNC_METRICS_PATH = $structuredDeadlineMetrics
          $structuredDeadlineOutput = cargo run --locked --bin nomo -- run examples/async_structured_deadline
          if (($structuredDeadlineOutput -join "`n") -notmatch "deadline elapsed true") {
            throw "unexpected structured deadline output"
          }
          $structuredDeadlinePayload = Get-Content -Raw $structuredDeadlineMetrics | ConvertFrom-Json
          if ($structuredDeadlinePayload.counters.poll_calls -ne 4 `
              -or $structuredDeadlinePayload.counters.frame_drops -ne 2 `
              -or $structuredDeadlinePayload.counters.peak_live_frames -ne 2 `
              -or $structuredDeadlinePayload.counters.ready_queue_enqueues -ne 3 `
              -or $structuredDeadlinePayload.counters.ready_queue_dequeues -ne 3 `
              -or $structuredDeadlinePayload.counters.task_spawns -ne 1 `
              -or $structuredDeadlinePayload.counters.task_joins -ne 1 `
              -or $structuredDeadlinePayload.counters.join_suspensions -ne 1 `
              -or $structuredDeadlinePayload.counters.deadline_registrations -ne 1 `
              -or $structuredDeadlinePayload.counters.deadline_expirations -ne 1 `
              -or $structuredDeadlinePayload.counters.deadline_cancellations -ne 0 `
              -or $structuredDeadlinePayload.counters.timer_registrations -ne 2 `
              -or $structuredDeadlinePayload.counters.timer_expirations -ne 1 `
              -or $structuredDeadlinePayload.counters.timer_cancellations -ne 1 `
              -or $structuredDeadlinePayload.counters.live_timers -ne 0 `
              -or $structuredDeadlinePayload.counters.peak_live_timers -ne 2) {
            throw "unexpected structured deadline counters"
          }
          $structuredPanicMetrics = Join-Path $env:RUNNER_TEMP "nomo-async-structured-panic-metrics.json"
          $env:NOMO_ASYNC_METRICS_PATH = $structuredPanicMetrics
          $structuredPanicOutput = cargo run --locked --bin nomo -- run examples/async_structured_panic_cleanup 2>&1
          $structuredPanicStatus = $LASTEXITCODE
          $LASTEXITCODE = 0
          if ($structuredPanicStatus -ne 1) {
            throw "structured panic example returned unexpected status $structuredPanicStatus"
          }
          $structuredPanicText = $structuredPanicOutput -join "`n"
          if ($structuredPanicText -notmatch "managed slow before" `
              -or $structuredPanicText -notmatch "panic: panic from child") {
            throw "unexpected structured panic output"
          }
          $structuredPanicPayload = Get-Content -Raw $structuredPanicMetrics | ConvertFrom-Json
          if ($structuredPanicPayload.counters.poll_calls -ne 4 `
              -or $structuredPanicPayload.counters.frame_drops -ne 3 `
              -or $structuredPanicPayload.counters.peak_live_frames -ne 3 `
              -or $structuredPanicPayload.counters.task_spawns -ne 2 `
              -or $structuredPanicPayload.counters.task_joins -ne 1 `
              -or $structuredPanicPayload.counters.join_suspensions -ne 1 `
              -or $structuredPanicPayload.counters.task_cancellations -ne 3 `
              -or $structuredPanicPayload.counters.timer_registrations -ne 1 `
              -or $structuredPanicPayload.counters.timer_expirations -ne 0 `
              -or $structuredPanicPayload.counters.timer_cancellations -ne 1 `
              -or $structuredPanicPayload.counters.live_timers -ne 0) {
            throw "unexpected structured panic counters"
          }
          $channelMetrics = Join-Path $env:RUNNER_TEMP "nomo-async-bounded-channel-metrics.json"
          $env:NOMO_ASYNC_METRICS_PATH = $channelMetrics
          $channelOutput = cargo run --locked --bin nomo -- run examples/async_bounded_channel
          if (($channelOutput -join "`n") -notmatch "^first`nsecond$") {
            throw "unexpected bounded-channel output"
          }
          $channelPayload = Get-Content -Raw $channelMetrics | ConvertFrom-Json
          if ($channelPayload.schema -ne 1 `
              -or $channelPayload.runtime -ne "nomo-c99-current-thread" `
              -or $channelPayload.counters.channel_constructions -ne 1 `
              -or $channelPayload.counters.channel_sends -ne 2 `
              -or $channelPayload.counters.channel_receives -ne 2 `
              -or $channelPayload.counters.channel_buffered_sends -ne 2 `
              -or $channelPayload.counters.channel_buffered_receives -ne 2 `
              -or $channelPayload.counters.channel_send_suspensions -ne 1 `
              -or $channelPayload.counters.channel_receive_suspensions -ne 0 `
              -or $channelPayload.counters.channel_wakeups -ne 1 `
              -or $channelPayload.counters.channel_closes -ne 1 `
              -or $channelPayload.counters.channel_cancellations -ne 0 `
              -or $channelPayload.counters.live_channel_buffered_elements -ne 0 `
              -or $channelPayload.counters.live_channel_send_waiters -ne 0 `
              -or $channelPayload.counters.live_channel_receive_waiters -ne 0) {
            throw "unexpected bounded-channel counters"
          }
          $selectMetrics = Join-Path $env:RUNNER_TEMP "nomo-async-static-select-metrics.json"
          $env:NOMO_ASYNC_METRICS_PATH = $selectMetrics
          $selectOutput = cargo run --locked --bin nomo -- run examples/async_static_select
          if (($selectOutput -join "`n") -notmatch "^winner$") {
            throw "unexpected static-select output"
          }
          $selectPayload = Get-Content -Raw $selectMetrics | ConvertFrom-Json
          if ($selectPayload.schema -ne 1 `
              -or $selectPayload.runtime -ne "nomo-c99-current-thread" `
              -or $selectPayload.counters.select_registrations -ne 3 `
              -or $selectPayload.counters.select_immediate_wins -ne 0 `
              -or $selectPayload.counters.select_suspended_wins -ne 1 `
              -or $selectPayload.counters.select_loser_cancellations -ne 2 `
              -or $selectPayload.counters.select_cancellations -ne 0 `
              -or $selectPayload.counters.live_channel_receive_waiters -ne 0 `
              -or $selectPayload.counters.live_timers -ne 0) {
            throw "unexpected static-select counters"
          }
      - name: Run owner-affine numeric TCP lifecycle through IOCP
        run: >-
          cargo test -p nomo --test cli_project
          async_tcp
          --locked
      - name: Run successful GET and POST paths through WinHTTP
        run: >-
          cargo test -p nomo --test cli_project
          nomo_run_executes_std_http_client_helpers_without_std_dependency
          --locked -- --exact
      - name: Run bounded and secret-safe failure paths through WinHTTP
        run: >-
          cargo test -p nomo --test cli_project
          structured_http_requests_enforce_limits_and_redact_secrets
          --locked -- --exact
      - name: Run text and SSE streaming paths through WinHTTP
        run: >-
          cargo test -p nomo --test cli_project
          structured_http_stream_
          --locked
      - name: Run shell-free controlled process stdio and safety gates
        run: >-
          cargo test -p nomo --test cli_project
          controlled_process
          --locked
      - name: Run structured JSON conformance and boundary gates
        run: >-
          cargo test -p nomo --test cli_project
          structured_json_
          --locked
      - name: Run JSON-RPC framing and MCP stdio gates
        shell: pwsh
        run: |
          cargo test -p nomo --test cli_project jsonrpc --locked
          cargo test -p nomo --test cli_project mcp_stdio_example_completes_two_jsonrpc_exchanges --locked -- --exact
      - name: Run bounded UTC cron conformance
        run: >-
          cargo test -p nomo --test cli_project
          cron_conformance_fixture_matches_native_runtime
          --locked -- --exact
      - name: Run isolated native task lifecycle
        run: cargo run --locked --bin nomo -- run examples/isolated_tasks
      - name: Run bundled SQLite conformance and persistence gates
        run: cargo test -p nomo --test cli_sqlite --locked

  macos-host-runtime:
    name: Run JSON, JSON-RPC, cron, task, and SQLite runtimes on macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Run current-thread async call ABI and timer counter probes
        shell: bash
        run: |
          metrics="$RUNNER_TEMP/nomo-async-metrics.json"
          NOMO_ASYNC_METRICS_PATH="$metrics" \
            cargo run --locked --bin nomo -- run examples/async_call_abi
          python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); c=p["counters"]; assert p["schema"] == 1 and p["runtime"] == "nomo-c99-current-thread"; assert c["poll_calls"] == 5 and c["cooperative_yields"] == 2 and c["frame_allocations"] == 0 and c["frame_drops"] == 2; assert c["timer_registrations"] == 0 and c["live_timers"] == 0; assert c["reactor_initializations"] == 0 and c["reactor_waits"] == 0 and c["reactor_timeouts"] == 0 and c["reactor_completions"] == 0 and c["reactor_errors"] == 0 and c["reactor_shutdowns"] == 0 and c["live_reactors"] == 0 and c["peak_live_reactors"] == 0' "$metrics"
          timer_metrics="$RUNNER_TEMP/nomo-async-timer-metrics.json"
          NOMO_ASYNC_METRICS_PATH="$timer_metrics" \
            cargo run --locked --bin nomo -- run examples/async_timer

name: Pull Request Smoke

on:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.12
          cache: false
      - name: Format
        run: cargo fmt --check
      - name: Lint affected compiler and runtime crates
        run: >-
          cargo clippy
          -p nomo
          -p nomo-compiler
          -p nomo-codegen-c
          -p nomo-std
          -p nomo-wasm
          -p nomo-manifest
          --locked -- -D warnings
      - name: Test affected compiler and runtime crates
        run: >-
          cargo test
          -p nomo
          -p nomo-compiler
          -p nomo-codegen-c
          -p nomo-std
          -p nomo-wasm
          -p nomo-manifest
          --locked
      - name: Build and verify browser WebAssembly runtime
        shell: bash
        run: |
          cargo build --locked --release \
            --target wasm32-unknown-unknown \
            -p nomo-wasm
          node scripts/check_browser_wasm.mjs \
            target/wasm32-unknown-unknown/release/nomo_wasm.wasm
      - name: Check project fixture
        run: cargo run --locked --bin nomo -- check --workspace examples/workspace_basic
      - name: Build release benchmark driver
        run: cargo build --locked --release --bin nomo
      - name: Test async benchmark harness
        run: python3 -m unittest discover -s scripts/tests
      - name: Run P0 async zero-cost and reference controls
        run: >-
          python3 scripts/async_benchmark.py
          --nomo target/release/nomo
          --require-clean
          --output performance/results/async-p0.json
      - name: Upload P0 async benchmark evidence
        uses: actions/upload-artifact@v7
        with:
          name: nomo-async-p0
          path: performance/results/async-p0.json
          if-no-files-found: error

  windows-host-runtime:
    name: Run native host runtimes on Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Verify the native C driver
        run: clang --version
      - name: Run current-thread async yield executor
        run: cargo run --locked --bin nomo -- run examples/async_yield
      - name: Run successful GET and POST paths through WinHTTP
        run: >-
          cargo test -p nomo --test cli_project
          nomo_run_executes_std_http_client_helpers_without_std_dependency
          --locked -- --exact
      - name: Run bounded and secret-safe failure paths through WinHTTP
        run: >-
          cargo test -p nomo --test cli_project
          structured_http_requests_enforce_limits_and_redact_secrets
          --locked -- --exact
      - name: Run text and SSE streaming paths through WinHTTP
        run: >-
          cargo test -p nomo --test cli_project
          structured_http_stream_
          --locked
      - name: Run shell-free controlled process stdio and safety gates
        run: >-
          cargo test -p nomo --test cli_project
          controlled_process
          --locked
      - name: Run structured JSON conformance and boundary gates
        run: >-
          cargo test -p nomo --test cli_project
          structured_json_
          --locked
      - name: Run JSON-RPC framing and MCP stdio gates
        shell: pwsh
        run: |
          cargo test -p nomo --test cli_project jsonrpc --locked
          cargo test -p nomo --test cli_project mcp_stdio_example_completes_two_jsonrpc_exchanges --locked -- --exact
      - name: Run bounded UTC cron conformance
        run: >-
          cargo test -p nomo --test cli_project
          cron_conformance_fixture_matches_native_runtime
          --locked -- --exact
      - name: Run isolated native task lifecycle
        run: cargo run --locked --bin nomo -- run examples/isolated_tasks
      - name: Run bundled SQLite conformance and persistence gates
        run: cargo test -p nomo --test cli_sqlite --locked

  macos-host-runtime:
    name: Run JSON, JSON-RPC, cron, task, and SQLite runtimes on macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Run current-thread async yield executor
        run: cargo run --locked --bin nomo -- run examples/async_yield
      - name: Run structured JSON conformance and boundary gates
        run: >-
          cargo test -p nomo --test cli_project
          structured_json_
          --locked
      - name: Run JSON-RPC framing and MCP stdio gates
        shell: bash
        run: |
          cargo test -p nomo --test cli_project jsonrpc --locked
          cargo test -p nomo --test cli_project mcp_stdio_example_completes_two_jsonrpc_exchanges --locked -- --exact
      - name: Run bounded UTC cron conformance
        run: >-
          cargo test -p nomo --test cli_project
          cron_conformance_fixture_matches_native_runtime
          --locked -- --exact
      - name: Run isolated native task lifecycle
        run: cargo run --locked --bin nomo -- run examples/isolated_tasks
      - name: Run bundled SQLite conformance and persistence gates
        run: cargo test -p nomo --test cli_sqlite --locked
